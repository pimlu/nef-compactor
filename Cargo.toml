[package]
name = "nef-compactor"
version = "0.1.0"
edition = "2024"

[dependencies]
jpegxl-rs = { version = "0.11", features = ["vendored"] }
jpegxl-sys = "0.11"
lexopt = "0.3"
zstd = "0.13"

[[bin]]
name = "nef-compactor"
path = "src/main.rs"

[[bin]]
name = "roundtrip-test"
path = "src/bin/roundtrip_test.rs"

[[bin]]
name = "dump-raw"
path = "src/bin/dump_raw.rs"
