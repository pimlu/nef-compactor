[package]
name = "nef-compactor"
version = "0.2.1"
edition = "2024"
description = "Lossless recompression of Nikon .NEF raw files with JPEG XL"
license = "MIT"
repository = "https://github.com/pimlu/nef-compactor"
readme = "README.md"
keywords = ["nikon", "nef", "raw", "compression"]
categories = ["command-line-utilities", "compression", "multimedia::images"]
exclude = ["album/"]

[dependencies]
jpegxl-rs = { version = "0.11", features = ["vendored"] }
jpegxl-sys = "0.11"
lexopt = "0.3"
zstd = "0.13"

[[bin]]
name = "nef-compactor"
path = "src/main.rs"

[[bin]]
name = "roundtrip-test"
path = "src/bin/roundtrip_test.rs"
required-features = ["debug-tools"]

[[bin]]
name = "dump-raw"
path = "src/bin/dump_raw.rs"
required-features = ["debug-tools"]

[features]
debug-tools = []

# Optimized build that still panics on arithmetic overflow. The intentional
# wrapping in the codec uses explicit wrapping_*/`as` casts, so this only traps
# *accidental* overflow. Build/run with `--profile release-checked`
# (binary at target/release-checked/). The default release stays fast.
[profile.release-checked]
inherits = "release"
overflow-checks = true
